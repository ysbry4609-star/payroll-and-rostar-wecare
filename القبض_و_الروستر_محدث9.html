<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وي كير | المرتبات والروستر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#122B3A;
    --navy-2:#1B3F52;
    --teal:#2E7D74;
    --teal-light:#DCEEEA;
    --gold:#C99A3E;
    --cream:#F7F4EE;
    --paper:#FFFFFF;
    --ink:#1E2A2E;
    --muted:#6B7B80;
    --line:#E4DFD2;
    --red:#B5453A;
    --red-bg:#FBEAE7;
    --green:#3E7A5B;
    --green-bg:#E7F2EB;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Tajawal', sans-serif;
    background:var(--cream);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3, .num{ font-family:'Cairo', sans-serif; }
  #app{ max-width:1180px; margin:0 auto; padding:20px 16px 60px; }

  /* ===== Header ===== */
  .topbar{
    background:linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%);
    border-radius:var(--radius);
    padding:20px 24px;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:14px;
    margin-bottom:18px;
    position:relative;
    overflow:hidden;
  }
  .topbar::after{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(600px 120px at 85% -20%, rgba(201,154,62,0.35), transparent 70%);
    pointer-events:none;
  }
  .brand{ display:flex; align-items:center; gap:12px; z-index:1;}
  .brand-mark{
    width:44px;height:44px;border-radius:10px;
    background:var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-family:'Cairo',sans-serif; font-weight:800; color:var(--navy); font-size:20px;
    flex-shrink:0;
  }
  .brand-text h1{ margin:0; font-size:19px; font-weight:800; letter-spacing:.2px;}
  .brand-text div{ font-size:12.5px; color:#CBD9DA; margin-top:2px;}
  .app-version{ font-size:11.5px; font-weight:700; color:#CBD9DA; background:rgba(255,255,255,.12); border-radius:6px; padding:2px 8px; margin-right:6px; vertical-align:middle; }
  .top-controls{ display:flex; gap:10px; align-items:center; z-index:1; flex-wrap:wrap;}
  .top-controls input[type=month]{
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.25);
    color:#fff;
    border-radius:8px;
    padding:9px 12px;
    font-family:'Tajawal',sans-serif;
    font-size:14px;
  }
  .top-controls input[type=month]::-webkit-calendar-picker-indicator{ filter:invert(1); }

  /* ===== Tabs ===== */
  .tabs{ display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;}
  .tab-btn{
    background:var(--paper);
    border:1px solid var(--line);
    color:var(--muted);
    padding:10px 20px;
    border-radius:999px;
    font-family:'Cairo',sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    transition:.15s;
  }
  .tab-btn.active{
    background:var(--teal);
    border-color:var(--teal);
    color:#fff;
  }

  /* ===== Site filter pills ===== */
  .filters{ display:flex; align-items:center; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .filters .label{ font-size:13px; color:var(--muted); margin-left:4px;}
  .pill{
    border:1px solid var(--line);
    background:var(--paper);
    padding:6px 16px;
    border-radius:999px;
    font-size:13.5px;
    cursor:pointer;
    color:var(--ink);
  }
  .pill.active{ background:var(--navy); color:#fff; border-color:var(--navy);}

  /* ===== Summary cards ===== */
  .summary{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:18px;}
  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
  }
  .card .lbl{ font-size:12px; color:var(--muted); margin-bottom:6px;}
  .card .val{ font-family:'Cairo',sans-serif; font-weight:800; font-size:21px; color:var(--navy);}
  .card.accent .val{ color:var(--teal); }
  .card.warn .val{ color:var(--red); }

  /* ===== Panel ===== */
  .panel{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:16px;
  }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
  .panel-head h2{ margin:0; font-size:16px; font-weight:800; color:var(--navy);}
  .btn{
    font-family:'Cairo',sans-serif;
    font-weight:700;
    font-size:13.5px;
    border-radius:8px;
    padding:9px 16px;
    border:1px solid transparent;
    cursor:pointer;
  }
  .btn-primary{ background:var(--teal); color:#fff;}
  .btn-primary:hover{ background:#256b63; }
  .btn-ghost{ background:transparent; border-color:var(--line); color:var(--navy);}
  .btn-ghost:hover{ background:var(--teal-light); }
  .btn-danger{ background:transparent; color:var(--red); border-color:var(--red-bg);}
  .btn-danger:hover{ background:var(--red-bg); }
  .btn-sm{ padding:6px 11px; font-size:12.5px;}

  /* ===== Employee form ===== */
  .emp-form{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:10px;
    background:var(--teal-light);
    padding:14px;
    border-radius:8px;
    margin-bottom:16px;
  }
  .field label{ display:block; font-size:12px; color:var(--muted); margin-bottom:4px;}
  .field input, .field select{
    width:100%;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:7px;
    font-family:'Tajawal',sans-serif;
    font-size:13.5px;
    background:#fff;
  }
  .emp-form .field-btn{ display:flex; align-items:flex-end; }
  .emp-form .field-btn button{ width:100%; }
  .notes-cell{ max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:right !important; }

  /* ===== Tables ===== */
  .table-wrap{ overflow-x:auto; border-radius:8px; border:1px solid var(--line);}
  table{ width:100%; border-collapse:collapse; font-size:13.5px; min-width:640px;}
  th, td{ padding:9px 10px; text-align:center; border-bottom:1px solid var(--line); white-space:nowrap;}
  th{ background:var(--navy); color:#fff; font-family:'Cairo',sans-serif; font-weight:700; font-size:12.5px; position:sticky; top:0;}
  td.name-cell{ text-align:right; font-weight:600; }
  tr:last-child td{ border-bottom:none; }
  tr:hover td{ background:#FAF9F5; }
  .tag{ display:inline-block; padding:2px 9px; border-radius:999px; font-size:11.5px; font-weight:600;}
  .tag.taj{ background:#EFE3C8; color:#7A5B15; }
  .tag.saray{ background:#D8E7F0; color:#1E5A78; }
  .tag.neutral{ background:#E7E4DC; color:#5B5548; }
  .tag.role{ background:var(--teal-light); color:var(--teal); }
  input.cell-input{
    width:72px; padding:5px 6px; border:1px solid var(--line); border-radius:6px; text-align:center; font-family:'Tajawal',sans-serif;
  }
  input.cell-input.wide{ width:88px; }
  .net-pos{ color:var(--green); font-weight:800; font-family:'Cairo',sans-serif;}
  .net-cell{ font-weight:800; font-family:'Cairo',sans-serif; color:var(--navy);}

  /* ===== Advances/Additions cell button + modal ===== */
  .adj-cell-btn{ display:flex; flex-direction:column; align-items:center; gap:1px; padding:6px 8px; min-width:78px; line-height:1.2; }
  .adj-cell-btn .adj-amt{ font-weight:800; font-family:'Cairo',sans-serif; color:var(--navy); font-size:13px; }
  .adj-cell-btn .adj-count{ font-size:10.5px; color:var(--muted); }
  .adj-row{ display:flex; gap:6px; align-items:center; }
  .adj-row input[type="date"]{ max-width:132px; }
  .adj-row input[type="text"]{ flex:1; min-width:0; }
  .adj-row input{ padding:7px 8px; border:1px solid var(--line); border-radius:6px; font-family:'Tajawal',sans-serif; font-size:13px; }
  .adj-del-btn{ padding:5px 10px !important; font-size:16px; line-height:1; font-weight:800; }

  /* ===== Calculator ===== */
  .calc-box{ width:100%; max-width:280px; }
  .calc-display{
    background:#0B2545; color:#fff; border-radius:8px; padding:14px 12px; text-align:left; direction:ltr;
    font-family:'Cairo',sans-serif; font-size:26px; font-weight:800; margin-bottom:10px; min-height:38px;
    overflow-x:auto; white-space:nowrap;
  }
  .calc-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .calc-grid button{
    padding:14px 0; border:1px solid var(--line); border-radius:8px; background:#fff; cursor:pointer;
    font-family:'Cairo',sans-serif; font-size:16px; font-weight:700; color:var(--navy);
  }
  .calc-grid button:hover{ background:var(--teal-light); }
  .calc-grid button.calc-op{ background:var(--teal-light); color:var(--teal); }
  .calc-grid button.calc-eq{ background:var(--teal); color:#fff; grid-row:span 2; }
  .calc-grid button.calc-clear{ background:var(--red-bg); color:var(--red); }
  .calc-fab{
    position:fixed; bottom:22px; left:22px; width:52px; height:52px; border-radius:50%;
    background:var(--navy,#0B2545); color:#fff; border:none; font-size:22px; box-shadow:0 6px 16px rgba(0,0,0,.25);
    cursor:pointer; z-index:40; display:flex; align-items:center; justify-content:center;
  }
  .calc-fab:hover{ background:var(--teal); }

  /* ===== Roster grid ===== */
  .day-head{ width:34px; font-size:11px; }
  .day-head.friday{ color:var(--gold); }
  .legend{ display:flex; gap:14px; flex-wrap:wrap; margin-top:12px; font-size:12.5px; color:var(--muted); }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .legend i{ width:13px; height:13px; border-radius:4px; display:inline-block; }

  /* ===== Gantt roster ===== */
  .roster-table{ min-width:520px; }
  .roster-table th.site-head{ font-size:13px; padding:8px 6px; }
  .roster-table th.site-head button{
    background:rgba(255,255,255,0.25); border:none; color:#0B2545; border-radius:6px;
    width:20px; height:20px; font-weight:800; cursor:pointer; margin-inline-start:6px; font-size:13px; line-height:1;
  }
  .roster-table td.date-cell{ font-weight:700; white-space:nowrap; text-align:center; }
  .roster-table td.weekday-cell{ color:var(--muted); font-size:12px; white-space:nowrap; }
  .roster-table td.slot-empty{ cursor:pointer; min-width:70px; }
  .roster-table td.slot-empty:hover{ background:#FAF6EA; }
  .roster-table td.slot-empty.pending{ background:var(--gold-light,#F3E3BC); box-shadow:inset 0 0 0 2px var(--gold); }
  .roster-table td.slot-block{ cursor:pointer; padding:0; }
  .block-cell{
    display:flex; flex-direction:column; justify-content:space-between; align-items:center;
    height:100%; min-height:36px; padding:6px 4px; font-family:'Cairo',sans-serif; font-weight:700; font-size:12.5px; color:#0B2545;
  }
  .block-cell .b-count{ font-size:11px; font-weight:800; opacity:.75; }
  .roster-table th.slot-label-head{ font-size:11px; font-weight:700; color:#0B2545; padding:5px 4px; }
  .roster-hint{ font-size:12.5px; color:var(--muted); margin-top:12px; line-height:1.9; }

  /* ===== Block picker modal ===== */
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(18,43,58,0.55);
    z-index:50; align-items:center; justify-content:center; padding:16px;
  }
  .modal-box{
    background:#fff; border-radius:12px; padding:20px; width:100%; max-width:380px;
    box-shadow:0 20px 50px rgba(0,0,0,0.25);
  }
  .modal-box h3{ margin:0 0 14px; font-size:15.5px; color:var(--navy); font-family:'Cairo',sans-serif;}
  .modal-box select, .modal-box input{
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:7px;
    font-family:'Tajawal',sans-serif; font-size:13.5px; background:#fff;
  }
  .modal-box .field label{ display:block; font-size:12px; color:var(--muted); margin-bottom:4px;}
  .modal-actions{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:4px;}

  .empty-state{ text-align:center; padding:40px 20px; color:var(--muted); font-size:14px; }
  .empty-state b{ color:var(--navy); display:block; margin-bottom:6px; font-family:'Cairo',sans-serif; font-size:15px;}

  .footer-note{ text-align:center; font-size:12px; color:var(--muted); margin-top:24px; }
  .save-flag{ font-size:12px; color:var(--teal); display:inline-flex; align-items:center; gap:5px; }

  @media (max-width:640px){
    .brand-text h1{ font-size:16px; }
    .card .val{ font-size:18px; }
  }

  /* ===== Print-only payroll report ===== */
  #printArea{display:none;}
  @media print{
    @page{margin:12mm 10mm; size:landscape;}
    html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block;position:absolute;top:0;right:0;left:0;padding:0;}
    .p-watermark{
      position:fixed;
      inset:0;
      z-index:-1;
      pointer-events:none;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='170'><text x='6' y='115' font-family='Arial' font-weight='bold' font-size='30' fill='%23122B3A' fill-opacity='0.075' transform='rotate(-28 130 85)'>WeCare</text></svg>");
      background-repeat:repeat;
    }
    .p-header{display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--navy);padding-bottom:14px;margin-bottom:16px;}
    .p-logo{width:52px;height:52px;border-radius:10px;overflow:hidden;flex-shrink:0;}
    .p-logo img{width:100%;height:100%;object-fit:cover;}
    .p-brand{font-family:'Cairo',sans-serif;font-weight:800;color:var(--navy);font-size:19px;}
    .p-dept{font-size:11px;color:#6B7280;}
    .p-meta{margin-inline-start:auto;text-align:left;font-size:12px;color:var(--ink);}
    .p-meta div{margin-bottom:2px;}
    .p-table{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:6px;}
    .p-table thead{display:table-header-group;} /* يكرر صف العناوين في كل صفحة عند تقطيع الطباعة */
    .p-table tr{page-break-inside:avoid;} /* يمنع تقطيع أي صف نص صفحة، فمفيش يوم يضيع */
    .p-table th{background:var(--navy);color:#fff;font-family:'Cairo',sans-serif;font-weight:700;padding:7px 6px;font-size:11px;}
    .p-table td{padding:6px;border-bottom:1px solid var(--line);text-align:center;}
    .p-table td.p-name{text-align:right;font-weight:700;}
    .p-table tr:nth-child(even) td{background:#FAF9F5;}
    .p-summary{background:var(--teal-light);border-radius:10px;padding:12px 14px;margin-top:14px;font-size:12.5px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;}
    .p-summary b{font-family:'Cairo',sans-serif;color:var(--teal);}
    .p-footer{text-align:center;margin-top:24px;font-size:11.5px;color:#6B7280;}
    .p-footer .tag{font-family:'Cairo',sans-serif;font-weight:800;color:var(--navy);font-size:13px;margin-top:3px;}
    .p-page-break{page-break-before:always;}
    .p-detail-table td.p-note{text-align:right;font-size:11px;color:#4B5563;}
    .p-detail-table td.p-type-adv{color:var(--red);font-weight:700;}
    .p-detail-table td.p-type-add{color:var(--teal);font-weight:700;}
  }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">W</div>
      <div class="brand-text">
        <h1>وي كير | المرتبات والروستر <span class="app-version" id="appVersion"></span></h1>
        <div id="monthLabel">—</div>
      </div>
    </div>
    <div class="top-controls">
      <input type="month" id="monthPicker">
      <select id="instancePicker" style="margin-right:8px;padding:8px 10px;border-radius:8px;border:1.5px solid #dfe4ea;font-family:inherit;font-size:13px;max-width:180px"></select>
      <button onclick="createNewInstance()" title="روستر جديد لنفس الشهر" style="margin-right:4px;padding:8px 10px;border-radius:8px;border:none;background:var(--navy,#0B2545);color:#fff;font-weight:700;cursor:pointer;font-size:13px">＋ روستر جديد</button>
      <button onclick="renameCurrentInstance()" title="تعديل اسم/ملاحظة هذه النسخة" style="margin-right:4px;padding:8px 10px;border-radius:8px;border:1.5px solid #dfe4ea;background:#fff;cursor:pointer;font-size:13px">✎</button>
      <button onclick="exportFullBackup()" title="تنزيل كل بيانات البرنامج في ملف واحد، عشان تنقلها لجهاز أو نسخة تانية" style="margin-right:8px;padding:8px 10px;border-radius:8px;border:1.5px solid #dfe4ea;background:#fff;cursor:pointer;font-size:13px">⬇️ تصدير كل البيانات</button>
      <button onclick="document.getElementById('backupFileInput').click()" title="استرجاع بيانات من ملف نسخة احتياطية" style="padding:8px 10px;border-radius:8px;border:1.5px solid #dfe4ea;background:#fff;cursor:pointer;font-size:13px">⬆️ استيراد البيانات</button>
      <input type="file" id="backupFileInput" accept="application/json" style="display:none" onchange="importFullBackup(this.files[0])">
    </div>
  </div>

  <div id="instanceNoteBar" style="display:none;background:#FFF8E6;border-bottom:1px solid #F2D98A;padding:7px 20px;font-size:12.5px;color:#7a5c00"></div>

  <div class="tabs">
    <button class="tab-btn" data-tab="employees">الموظفين</button>
    <button class="tab-btn" data-tab="roster">الروستر</button>
    <button class="tab-btn" data-tab="payroll">المرتبات</button>
  </div>

  <div class="filters">
    <span class="label">الموقع:</span>
    <span class="pill" data-site="all">الكل</span>
    <span class="pill" data-site="تاج">تاج</span>
    <span class="pill" data-site="سراي">سراي</span>
    <span class="pill" data-site="محايد">محايد</span>
    <span style="flex:1"></span>
    <span class="save-flag" id="saveFlag"></span>
  </div>

  <div id="summary" class="summary"></div>
  <div id="tabContent"></div>

  <div class="footer-note" id="footerNote">البيانات بتتحفظ تلقائي — من غير سيرفر ولا إكسل خارجي.</div>
</div>

<div id="printArea"></div>
<div id="modalOverlay" class="modal-overlay"></div>
<div id="calcOverlay" class="modal-overlay"></div>

function monthKeyNow(){

  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');

function uid(){ return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function escapeHTML(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function daysInMonth(monthKey){
  const [y,m] = monthKey.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}
function weekdayAr(monthKey, day){
  const [y,m] = monthKey.split('-').map(Number);
  const d = new Date(y, m-1, day);
  const names = ['أحد','إثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
  return names[d.getDay()];
}
function isFriday(monthKey, day){
  const [y,m] = monthKey.split('-').map(Number);
  return new Date(y, m-1, day).getDay() === 5;
}
function fmtMoney(n){
  n = Number(n)||0;
  return n.toLocaleString('ar-EG', {maximumFractionDigits:0}) + ' ج.م';
}
function monthLabelAr(monthKey){
  const [y,m] = monthKey.split('-').map(Number);
  const names = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  return names[m-1] + ' ' + y;
}

/* ============================= STORAGE ============================= */
let usingLocalFallback = false;

async function dbGet(key){
  if(typeof window.storage !== 'undefined'){
    try{
      const r = await window.storage.get(key);
      return r ? r.value : null;
    }catch(e){ /* fall through to local */ }
  }
  usingLocalFallback = true;
  try{ return localStorage.getItem('wecare_'+key); }catch(e){ return null; }
}

async function dbSet(key, value){
  if(typeof window.storage !== 'undefined'){
    try{
      await window.storage.set(key, value);
      return;
    }catch(e){ /* fall through to local */ }
  }
  usingLocalFallback = true;
  try{ localStorage.setItem('wecare_'+key, value); }catch(e){ console.error(e); }
}

/* ============================= نسخة احتياطية كاملة (تصدير / استيراد) ============================= */
// دي عشان تقدر تنقل كل بيانات البرنامج (الموظفين، الروستر، المرتبات بكل شهورها) من جهاز/نسخة لنسخة تانية
// (مثلاً من النسخة اللي شغالة محليًا على جهازك للنسخة المرفوعة على GitHub) من غير ما تدخلها يدوي من الأول.
async function getAllStorageKeys(){
  if(typeof window.storage !== 'undefined'){
    try{
      const r = await window.storage.list();
      return (r && r.keys) ? r.keys : [];
    }catch(e){ return []; }
  }
  const keys = [];
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith('wecare_')) keys.push(k.slice('wecare_'.length));
    }
  }catch(e){ /* ignore */ }
  return keys;
}

async function exportFullBackup(){
  const keys = await getAllStorageKeys();
  if(!keys.length){ alert('مفيش بيانات متسجلة في النسخة دي لسه.'); return; }
  const data = {};
  for(const k of keys){
    const v = await dbGet(k);
    if(v!=null) data[k] = v;
  }
  const payload = { app:'wecare-payroll-roster', version: APP_VERSION, exportedAt: new Date().toISOString(), data };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `نسخة_احتياطية_المرتبات_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

async function importFullBackup(file){
  if(!file) return;
  if(!confirm('هيتم استرجاع البيانات من الملف ده وتحطّ فوق أي بيانات موجودة بنفس المفتاح (نفس الشهر/الموظفين) في النسخة دي. البيانات اللي مش متعارضة هتتضاف عادي. تكمل؟')){
    document.getElementById('backupFileInput').value = '';
    return;
  }
  try{
    const text = await file.text();
    const payload = JSON.parse(text);
    const data = (payload && payload.data) ? payload.data : payload; // لو ملف قديم من غير غلاف
    const keys = Object.keys(data||{});
    if(!keys.length) throw new Error('الملف مش فيه بيانات');
    for(const k of keys){
      await dbSet(k, data[k]);
    }
    alert(`تم استيراد ${keys.length} عنصر بنجاح. هيتم تحديث الصفحة دلوقتي.`);
    location.reload();
  }catch(e){
    alert('الملف مش صالح أو فيه مشكلة في القراءة: ' + e.message);
  }finally{
    document.getElementById('backupFileInput').value = '';
  }
}

async function loadAll(){
  const emp = await dbGet('employees');
  try{ employees = emp ? JSON.parse(emp) : []; }catch(e){ employees = []; }
  await loadInstancesList();
  await loadMonthData();
  updateStorageBadge();
}
async function loadInstancesList(){
  const raw = await dbGet('rosterInstances:'+currentMonth);
  try{ rosterInstances = raw ? JSON.parse(raw) : []; }catch(e){ rosterInstances = []; }
  if(!rosterInstances.length){
    rosterInstances = [{ id:'default', note:'' }];
    await dbSet('rosterInstances:'+currentMonth, JSON.stringify(rosterInstances));
  }
  if(!rosterInstances.find(i=>i.id===currentInstanceId)){
    currentInstanceId = rosterInstances[0].id;
  }
  renderInstancePicker();
}
function renderInstancePicker(){
  const sel = document.getElementById('instancePicker');

async function loadMonthData(){

  if(!rosterData.taj) rosterData.taj = [{label:'المسعفين', blocks:[]}, {label:'فني', blocks:[]}];
  if(!rosterData.saray) rosterData.saray = [{label:'المسعفين', blocks:[]}, {label:'فني', blocks:[]}];
  if(!rosterData.admin) rosterData.admin = [{label:'المشرفين', blocks:[]}];
  // migrate legacy slot format (plain arrays of blocks) to labeled slots
  ['taj','saray'].forEach(k=>{
    rosterData[k] = rosterData[k].map((s,i)=> Array.isArray(s) ? { label: i===0?'المسعفين': i===1?'فني':('عمود '+(i+1)), blocks: s } : s);
  });
  pendingSelection = null;

  try{ payrollAdj = p ? JSON.parse(p) : {}; }catch(e){ payrollAdj = {}; }

}

// تحويل صيغة السلف/الإضافات القديمة (رقم واحد) لصيغة قائمة عناصر (مبلغ + تاريخ + ملاحظة)
function migratePayrollAdj(){
  Object.keys(payrollAdj).forEach(id=>{
    const adj = payrollAdj[id];
    if(!Array.isArray(adj.advancesList)){
      adj.advancesList = (Number(adj.advances)>0) ? [{ id: genAdjId(), amount: Number(adj.advances), date:'', note:'' }] : [];
    }
    if(!Array.isArray(adj.additionsList)){
      adj.additionsList = (Number(adj.additions)>0) ? [{ id: genAdjId(), amount: Number(adj.additions), date:'', note:'' }] : [];
    }
    delete adj.advances;
    delete adj.additions;
  });
}
function genAdjId(){ return 'adj_' + Date.now() + '_' + Math.random().toString(36).slice(2,7); }
function sumAdjList(list){ return (list||[]).reduce((s,x)=> s + (Number(x.amount)||0), 0); }

/* ============================= CALC ============================= */
function computeRow(emp, monthKey){
  const days = daysInMonth(monthKey);
  let present=0, leave=0, extra=0;
  ['taj','saray','admin'].forEach(site=>{
    (rosterData[site]||[]).forEach(slot=>{
      (slot.blocks||[]).forEach(b=>{
        if(b.employeeId === emp.id){
          const len = b.end - b.start + 1;
          if(b.category==='leave') leave += len;
          else if(b.category==='extra') extra += len;
          else present += len;
        }
      });
    });
  });
  const countedDays = present + leave; // leave = paid leave, counts toward base
  const adj = payrollAdj[emp.id] || {};
  const manualAdditions = sumAdjList(adj.additionsList);
  const deductions = Number(adj.deductions)||0;
  const advances = sumAdjList(adj.advancesList);
  const rate = Number(emp.rate)||0;

  let base = 0, autoAdditions = 0;
  if(emp.salaryType === 'daily'){
    base = rate * countedDays;
    autoAdditions = rate * extra;
  } else {
    base = rate;
    autoAdditions = (days>0 ? (rate/days) : 0) * extra;
  }
  const totalAdditions = autoAdditions + manualAdditions;
  const net = base + totalAdditions - deductions - advances;
  return { days, present, leave, extra, countedDays, base, autoAdditions, manualAdditions, totalAdditions, deductions, advances, net };
}

function filteredEmployees(){
  return siteFilter==='all' ? employees : employees.filter(e=>e.site===siteFilter);
}

function payrollEligibleEmployees(){
  return filteredEmployees().filter(e=>{
    const r = computeRow(e, currentMonth);
    return (r.present + r.leave + r.extra) > 0;
  });
}

/* ============================= RENDER: ROSTER TAB (Gantt blocks) ============================= */
function buildCoverage(slot, days){
  const map = {};
  slot.forEach(b=>{
    for(let d=b.start; d<=b.end; d++){
      map[d] = (d===b.start) ? {type:'start', block:b} : {type:'skip', block:b};
    }
  });
  return map;
}

function siteBlockColor(site, block){
  return CATEGORY_COLOR[block.category] || SITE_COLOR[site];
}

function renderRosterTab(){
  const days = daysInMonth(currentMonth);
  const sitesToShow = (siteFilter==='تاج' || siteFilter==='سراي') ? [siteFilter] : ['تاج','سراي'];

  let headRow1 = `<th rowspan="2" style="min-width:90px;">التاريخ</th><th rowspan="2" style="min-width:70px;">اليوم</th>`;
  let headRow2 = '';
  const coverage = {};
  sitesToShow.forEach(siteAr=>{
    const key = SITE_KEY[siteAr];
    const slots = rosterData[key];
    coverage[key] = slots.map(slot=>buildCoverage(slot.blocks, days));
    headRow1 += `<th class="site-head" colspan="${slots.length}" style="background:${SITE_COLOR[key]}">${siteAr}<button onclick="addSlot('${key}')" title="إضافة عمود">＋</button>${slots.length>1?`<button onclick="removeSlot('${key}')" title="حذف آخر عمود فاضي">－</button>`:''}</th>`;
    slots.forEach((slot, slotIdx)=>{
      headRow2 += `<th class="slot-label-head" onclick="renameSlot('${key}',${slotIdx})" title="دوس عشان تغيّر الاسم" style="background:${SITE_COLOR[key]}99;cursor:pointer;">${escapeHTML(slot.label||('عمود '+(slotIdx+1)))} ✎</th>`;
    });
  });
  // عمود مشترك للمشرفين، بعد الموقعين مباشرة، ظاهر دايمًا بغض النظر عن فلتر الموقع
  coverage.admin = rosterData.admin.map(slot=>buildCoverage(slot.blocks, days));
  headRow1 += `<th class="site-head" colspan="1" style="background:${SITE_COLOR.admin}">المشرفين</th>`;
  headRow2 += `<th class="slot-label-head" style="background:${SITE_COLOR.admin}99;">المشرفين</th>`;

  let bodyRows = '';
  for(let d=1; d<=days; d++){
    let cells = `<td class="date-cell">${d}/${currentMonth.split('-')[1]}</td><td class="weekday-cell ${isFriday(currentMonth,d)?'friday':''}">${weekdayAr(currentMonth,d)}</td>`;
    sitesToShow.forEach(siteAr=>{
      const key = SITE_KEY[siteAr];
      const slots = rosterData[key];
      slots.forEach((slot, slotIdx)=>{
        const cov = coverage[key][slotIdx][d];
        if(cov && cov.type==='skip') return; // covered by rowspan above
        if(cov && cov.type==='start'){
          const b = cov.block;
          const len = b.end - b.start + 1;
          const color = siteBlockColor(key, b);
          cells += `<td class="slot-block" rowspan="${len}" style="background:${color}" onclick="editBlock('${key}',${slotIdx},${b.start})">
            <div class="block-cell"><div>${escapeHTML(b.label)}</div><div class="b-count">${len}</div></div>
          </td>`;
        } else {
          const isPending = pendingSelection && pendingSelection.site===key && pendingSelection.slotIndex===slotIdx && pendingSelection.day===d;
          cells += `<td class="slot-empty ${isPending?'pending':''}" onclick="handleSlotClick('${key}',${slotIdx},${d})"></td>`;
        }
      });
    });
    // خلية عمود المشرفين المشترك
    {
      const key = 'admin';
      const slotIdx = 0;
      const cov = coverage.admin[slotIdx][d];
      if(!(cov && cov.type==='skip')){
        if(cov && cov.type==='start'){
          const b = cov.block;
          const len = b.end - b.start + 1;
          const color = siteBlockColor(key, b);
          cells += `<td class="slot-block" rowspan="${len}" style="background:${color}" onclick="editBlock('${key}',${slotIdx},${b.start})">
            <div class="block-cell"><div>${escapeHTML(b.label)}</div><div class="b-count">${len}</div></div>
          </td>`;
        } else {
          const isPending = pendingSelection && pendingSelection.site===key && pendingSelection.slotIndex===slotIdx && pendingSelection.day===d;
          cells += `<td class="slot-empty ${isPending?'pending':''}" onclick="handleSlotClick('${key}',${slotIdx},${d})"></td>`;
        }
      }
    }
    bodyRows += `<tr>${cells}</tr>`;
  }

  document.getElementById('tabContent').innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h2>روستر ${monthLabelAr(currentMonth)}</h2>
        <button class="btn btn-primary" onclick="downloadRosterPDF()">🖨️ حفظ PDF (بالعلامة المائية)</button>
      </div>
      <div class="table-wrap">
        <table class="roster-table">
          <thead><tr>${headRow1}</tr><tr>${headRow2}</tr></thead>
          <tbody>${bodyRows}</tbody>
        </table>
      </div>
      <div class="roster-hint">
        كل موقع فيه عمودين ثابتين: <b>المسعفين</b> و<b>فني</b> (للسواقين) — تقدر تغيّر اسم أي عمود بالدوس عليه، أو تضيف عمود جديد بالـ ＋. وفيه عمود ثابت واحد بعد الموقعين اسمه <b>المشرفين</b> لتسجيل أيام أي مشرف أو إداري، وبيتحسب في المرتبات زي أي حد تاني.
        دوس على أي خانة فاضية تحدد يوم البداية، وبعدين دوس على يوم النهاية في نفس العمود عشان تعمل فترة عمل لموظف — هيتسألك اسم الموظف ونوع الفترة (شغل عادي / إجازة مدفوعة / يوم إضافي).
        دوس على أي فترة موجودة عشان تعدلها أو تمسحها. عدد الأيام بيتحسب تلقائي وبيتحط جوه الفترة، وبيتوصل لصفحة المرتبات أوتوماتيك.
      </div>
    </div>
  `;
}

function groupedEmployeeOptions(site){

    }).join('');
  }
  const siteAr = site==='taj' ? 'تاج' : 'سراي';
  const otherAr = site==='taj' ? 'سراي' : 'تاج';
  const groups = [
    { label: `عمال ${siteAr}`, list: employees.filter(e=>e.site===siteAr && isWorker(e)) },
    { label: `عمال ${otherAr}`, list: employees.filter(e=>e.site===otherAr && isWorker(e)) },
    { label: 'عمال محايدين', list: employees.filter(e=>e.site==='محايد' && isWorker(e)) },
    { label: 'الإداريين والمشرفين', list: employees.filter(isAdmin) }
  ];
  return groups.map(g=>{
    if(!g.list.length) return '';
    return `<optgroup label="${escapeHTML(g.label)}">${g.list.map(e=>`<option value="${e.id}">${escapeHTML(e.name)}</option>`).join('')}</optgroup>`;
  }).join('');
}

async function handleSlotClick(site, slotIndex, day){
  if(!pendingSelection){
    pendingSelection = { site, slotIndex, day };
    renderRosterTab();
    return;
  }
  if(pendingSelection.site!==site || pendingSelection.slotIndex!==slotIndex){
    pendingSelection = { site, slotIndex, day };
    renderRosterTab();
    return;
  }
  if(pendingSelection.day===day){
    pendingSelection = null;
    renderRosterTab();
    return;
  }
  const start = Math.min(pendingSelection.day, day);
  const end = Math.max(pendingSelection.day, day);
  pendingSelection = null;

  const slot = rosterData[site][slotIndex].blocks;
  const overlap = slot.some(b => !(end < b.start || start > b.end));
  if(overlap){
    alert('الفترة دي متداخلة مع فترة موجودة بالفعل في نفس العمود.');
    renderRosterTab();
    return;
  }
  renderRosterTab();
  openBlockModal({ site, slotIndex, start, end, block: null });
}

async function editBlock(site, slotIndex, startDay){
  const slot = rosterData[site][slotIndex].blocks;
  const idx = slot.findIndex(b=>b.start===startDay);
  if(idx===-1) return;
  openBlockModal({ site, slotIndex, start: slot[idx].start, end: slot[idx].end, block: slot[idx] });
}

function closeModal(){
  document.getElementById('modalOverlay').style.display = 'none';
  pendingSelection = null;
  renderRosterTab();
}

async function confirmBlockModal(){
  const overlay = document.getElementById('modalOverlay');
  const site = overlay.dataset.site;
  const slotIndex = Number(overlay.dataset.slotIndex);
  const start = Number(overlay.dataset.start);
  const end = Number(overlay.dataset.end);
  const empId = document.getElementById('mdlEmpSelect').value;
  const manualName = document.getElementById('mdlManualName').value.trim();
  const category = document.getElementById('mdlCategory').value;

  let label, employeeId;
  if(empId){
    const emp = employees.find(e=>e.id===empId);
    label = emp ? emp.name : '';
    employeeId = empId;
  } else {
    if(!manualName){ alert('اختار موظف من القائمة أو اكتب اسم يدوي.'); return; }
    label = manualName;
    employeeId = null;
  }

  const slot = rosterData[site][slotIndex].blocks;
  const existingIdx = slot.findIndex(b=>b.start===start && b.end===end);
  if(existingIdx>-1){
    slot[existingIdx].label = label;
    slot[existingIdx].employeeId = employeeId;
    slot[existingIdx].category = category;
  } else {
    slot.push({ start, end, label, employeeId, category });
    slot.sort((a,b)=>a.start-b.start);
  }
  await saveRoster();
  document.getElementById('modalOverlay').style.display = 'none';
  renderRosterTab();
  renderSummary();
}

async function confirmBlockDelete(){
  const overlay = document.getElementById('modalOverlay');
  const site = overlay.dataset.site;
  const slotIndex = Number(overlay.dataset.slotIndex);
  const start = Number(overlay.dataset.start);
  const end = Number(overlay.dataset.end);
  const slot = rosterData[site][slotIndex].blocks;
  const idx = slot.findIndex(b=>b.start===start && b.end===end);
  if(idx>-1) slot.splice(idx,1);
  await saveRoster();
  document.getElementById('modalOverlay').style.display = 'none';
  renderRosterTab();
  renderSummary();
}

async function addSlot(site){
  const name = prompt('اسم العمود الجديد:', 'عمود ' + (rosterData[site].length+1));
  if(name===null) return;
  rosterData[site].push({ label: name.trim() || ('عمود '+(rosterData[site].length+1)), blocks: [] });
  await saveRoster();
  renderRosterTab();
}
async function removeSlot(site){
  const slots = rosterData[site];
  for(let i=slots.length-1; i>=0; i--){
    if(slots[i].blocks.length===0){ slots.splice(i,1); break; }
  }
  await saveRoster();
  renderRosterTab();
}
async function renameSlot(site, slotIndex){
  const slot = rosterData[site][slotIndex];
  const name = prompt('اسم العمود:', slot.label || '');
  if(name===null) return;
  slot.label = name.trim() || slot.label;
  await saveRoster();
  renderRosterTab();
}

function buildRosterPrintHTML(){
  const days = daysInMonth(currentMonth);
  const sitesToShow = ['تاج','سراي'];
  const coverage = {};
  let headCols = `<th rowspan="2">التاريخ</th><th rowspan="2">اليوم</th>`;
  let headCols2 = '';
  sitesToShow.forEach(siteAr=>{
    const key = SITE_KEY[siteAr];
    const slots = rosterData[key];
    coverage[key] = slots.map(slot=>buildCoverage(slot.blocks, days));
    headCols += `<th colspan="${slots.length}" style="background:${SITE_COLOR[key]}">${siteAr}</th>`;
    slots.forEach(slot=>{ headCols2 += `<th style="background:${SITE_COLOR[key]}99;font-size:9px;">${escapeHTML(slot.label||'')}</th>`; });
  });
  // عمود المشرفين المشترك بعد الموقعين
  coverage.admin = rosterData.admin.map(slot=>buildCoverage(slot.blocks, days));
  headCols += `<th style="background:${SITE_COLOR.admin}">المشرفين</th>`;
  headCols2 += `<th style="background:${SITE_COLOR.admin}99;font-size:9px;">المشرفين</th>`;
  let rows = '';
  for(let d=1; d<=days; d++){
    let cells = `<td style="font-weight:700">${d}/${currentMonth.split('-')[1]}</td><td>${weekdayAr(currentMonth,d)}</td>`;
    sitesToShow.forEach(siteAr=>{
      const key = SITE_KEY[siteAr];
      const slots = rosterData[key];
      slots.forEach((slot, slotIdx)=>{
        const cov = coverage[key][slotIdx][d];
        if(cov){
          const b = cov.block;
          const isStart = cov.type==='start';
          const len = b.end - b.start + 1;
          // بدون rowspan عشان مفيش يوم يضيع لو الطباعة قطعت صفحة في نص الفترة
          cells += `<td style="background:${siteBlockColor(key,b)};font-weight:700">${isStart ? escapeHTML(b.label)+'<br><span style="font-size:9px;opacity:.7">'+len+'</span>' : ''}</td>`;
        } else {
          cells += `<td></td>`;
        }
      });
    });
    // خلية عمود المشرفين
    {
      const cov = coverage.admin[0][d];
      if(cov){
        const b = cov.block;
        const isStart = cov.type==='start';
        const len = b.end - b.start + 1;
        cells += `<td style="background:${siteBlockColor('admin',b)};font-weight:700">${isStart ? escapeHTML(b.label)+'<br><span style="font-size:9px;opacity:.7">'+len+'</span>' : ''}</td>`;
      } else {
        cells += `<td></td>`;
      }
    }
    rows += `<tr style="page-break-inside:avoid">${cells}</tr>`;
  }
  return `
    <div class="p-watermark"></div>
    <div class="p-header">
      <div class="p-logo"><img src="${LOGO}"></div>
      <div><div class="p-brand">WeCare</div><div class="p-dept">Roster — روستر المسعفين والسواقين</div></div>
      <div class="p-meta"><div><b>الشهر:</b> ${monthLabelAr(currentMonth)}</div></div>
    </div>
    <table class="p-table" style="font-size:10px;"><thead><tr>${headCols}</tr><tr>${headCols2}</tr></thead><tbody>${rows}</tbody></table>
    <div class="p-footer"><div>Payroll and Roster System</div><div class="tag">WeCare Company</div></div>
  `;
}

let calcExpr = '';
function openCalculator(){

function renderCalculator(){
  const overlay = document.getElementById('calcOverlay');
  overlay.innerHTML = `
    <div class="modal-box calc-box">
      <h3>الآلة الحاسبة</h3>
      <div class="calc-display" id="calcDisplay">${escapeHTMLp(calcExpr) || '0'}</div>
      <div class="calc-grid">
        <button class="calc-clear" onclick="calcClear()">C</button>
        <button onclick="calcBackspace()">⌫</button>
        <button class="calc-op" onclick="calcInput('%')">%</button>
        <button class="calc-op" onclick="calcInput('/')">÷</button>

        <button onclick="calcInput('7')">7</button>
        <button onclick="calcInput('8')">8</button>
        <button onclick="calcInput('9')">9</button>
        <button class="calc-op" onclick="calcInput('*')">×</button>

        <button onclick="calcInput('4')">4</button>
        <button onclick="calcInput('5')">5</button>
        <button onclick="calcInput('6')">6</button>
        <button class="calc-op" onclick="calcInput('-')">−</button>

        <button onclick="calcInput('1')">1</button>
        <button onclick="calcInput('2')">2</button>
        <button onclick="calcInput('3')">3</button>
        <button class="calc-op" onclick="calcInput('+')">+</button>

        <button onclick="calcInput('0')" style="grid-column:span 2;">0</button>
        <button onclick="calcInput('.')">.</button>
        <button class="calc-eq" onclick="calcEquals()">=</button>
      </div>
      <div class="modal-actions" style="margin-top:14px;">
        <span></span>
        <button class="btn btn-ghost" onclick="closeCalculator()">إغلاق</button>
      </div>
    </div>
  `;
}
function calcInput(ch){
  calcExpr += ch;
  document.getElementById('calcDisplay').textContent = calcExpr;
}
function calcClear(){
  calcExpr = '';
  document.getElementById('calcDisplay').textContent = '0';
}
function calcBackspace(){
  calcExpr = calcExpr.slice(0,-1);
  document.getElementById('calcDisplay').textContent = calcExpr || '0';
}
function calcEquals(){
  if(!/^[0-9+\-*/.% ]+$/.test(calcExpr)){ calcExpr = 'خطأ'; document.getElementById('calcDisplay').textContent = calcExpr; return; }
  try{
    // eslint-disable-next-line no-new-func
    const result = Function('"use strict"; return (' + calcExpr.replace(/%/g,'/100') + ')')();
    calcExpr = String(Math.round((result + Number.EPSILON) * 100000) / 100000);
  }catch(e){
    calcExpr = 'خطأ';
  }
  document.getElementById('calcDisplay').textContent = calcExpr;
}

        <div>الموقع: ${escapeHTMLp(siteLabel)}</div>
        <div>الشهر: ${monthLabelAr(currentMonth)}</div>
        ${(() => { const cur = rosterInstances.find(i=>i.id===currentInstanceId); return cur && cur.note ? `<div>النسخة: ${escapeHTMLp(cur.note)}</div>` : ''; })()}
      </div>
    </div>
    <table class="p-table">
      <thead><tr>
        <th>الاسم</th><th>الموقع</th><th>الوظيفة</th><th>نوع الراتب</th><th>أيام الحضور</th>
        <th>الأساسي</th><th>الإضافات</th><th>خصومات وسلف</th><th>الصافي</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="p-summary">
      <div><b>عدد الأفراد:</b> ${list.length}</div>
      <div><b>إجمالي الأساسي:</b> ${fmtMoney(totalBase)}</div>
      <div><b>إجمالي الإضافات:</b> ${fmtMoney(totalAdd)}</div>
      <div><b>إجمالي الخصومات والسلف:</b> ${fmtMoney(totalDedAdv)}</div>
      <div><b>إجمالي الصافي:</b> ${fmtMoney(totalNet)}</div>
    </div>
    <div class="p-footer">
      <div>Payroll and Roster System</div>
      <div class="tag">WeCare Company</div>
    </div>
    ${buildAdjDetailsPageHTML(list, siteLabel)}
  `;
}

function buildAdjDetailsPageHTML(list, siteLabel){
  // بيبني صفحة تانية فيها تفصيل كل بنود السلف والإضافات (تاريخ + مبلغ + ملاحظة) لكل موظف عنده بنود
  let detailRows = '';
  let anyEntries = false;
  list.forEach(e=>{
    const adj = payrollAdj[e.id] || {};
    const advances = adj.advancesList || [];
    const additions = adj.additionsList || [];
    if(!advances.length && !additions.length) return;
    anyEntries = true;
    advances.forEach(item=>{
      detailRows += `
        <tr>
          <td class="p-name">${escapeHTMLp(e.name)}</td>
          <td class="p-type-adv">سلفة</td>
          <td>${item.date ? escapeHTMLp(item.date) : '—'}</td>
          <td>${fmtMoney(item.amount)}</td>
          <td class="p-note">${item.note ? escapeHTMLp(item.note) : '—'}</td>
        </tr>`;
    });
    additions.forEach(item=>{
      detailRows += `
        <tr>
          <td class="p-name">${escapeHTMLp(e.name)}</td>
          <td class="p-type-add">إضافة</td>
          <td>${item.date ? escapeHTMLp(item.date) : '—'}</td>
          <td>${fmtMoney(item.amount)}</td>
          <td class="p-note">${item.note ? escapeHTMLp(item.note) : '—'}</td>
        </tr>`;
    });
  });

  if(!anyEntries) return ''; // مفيش بنود سلف/إضافات مسجلة الشهر ده، فمنضيفش صفحة فاضية

  return `
    <div class="p-page-break"></div>
    <div class="p-watermark"></div>
    <div class="p-header">
      <div class="p-logo"><img src="${LOGO}"></div>
      <div>
        <div class="p-brand">WeCare</div>
        <div class="p-dept">Payroll Department — قسم المرتبات</div>
      </div>
      <div class="p-meta">
        <div><b>تفاصيل السلف والإضافات</b></div>
        <div>الموقع: ${escapeHTMLp(siteLabel)}</div>
        <div>الشهر: ${monthLabelAr(currentMonth)}</div>
      </div>
    </div>
    <table class="p-table p-detail-table">
      <thead><tr>
        <th>الاسم</th><th>النوع</th><th>التاريخ</th><th>المبلغ</th><th>الملاحظة</th>
      </tr></thead>
      <tbody>${detailRows}</tbody>
    </table>
    <div class="p-footer">
      <div>Payroll and Roster System</div>
      <div class="tag">WeCare Company</div>
    </div>
  `;
}

function escapeHTMLp(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function downloadPDF(){
  document.getElementById('printArea').innerHTML = buildPrintHTML();
  setTimeout(()=>window.print(), 250);
}

function exportCSV(){
  const list = payrollEligibleEmployees();
  let csv = '\uFEFF' + ['الاسم','الموقع','الوظيفة','نوع الراتب','السعر','أيام الحضور','أيام إضافية','الأساسي','إجمالي الإضافات','خصومات','سلف','الصافي'].join(',') + '\n';
  list.forEach(e=>{
    const r = computeRow(e, currentMonth);
    csv += [e.name, e.site, e.role, e.salaryType==='daily'?'يومي':'شهري', e.rate, r.countedDays, r.extra, r.base.toFixed(0), r.totalAdditions.toFixed(0), r.deductions, r.advances, r.net.toFixed(0)].join(',') + '\n';
  });
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  const cur = rosterInstances.find(i=>i.id===currentInstanceId);
  const suffix = cur && cur.note ? '-' + cur.note.replace(/[^\p{L}\p{N}]+/gu, '_') : '';
  link.download = `مرتبات-${currentMonth}${suffix}.csv`;
  link.click();
}

/* ============================= TAB / FILTER WIRING ============================= */
function renderTab(){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===activeTab));
  document.querySelectorAll('.pill').forEach(b=>b.classList.toggle('active', b.dataset.site===siteFilter));
  if(activeTab==='employees') renderEmployeesTab();
  else if(activeTab==='roster') renderRosterTab();
  else renderPayrollTab();
  renderSummary();
}

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{ activeTab = btn.dataset.tab; renderTab(); });
});
document.querySelectorAll('.pill').forEach(btn=>{
  btn.addEventListener('click', ()=>{ siteFilter = btn.dataset.site; renderTab(); });
});
document.getElementById('monthPicker').addEventListener('change', async (e)=>{
  currentMonth = e.target.value;
  document.getElementById('monthLabel').textContent = monthLabelAr(currentMonth);
  currentInstanceId = 'default';
  await loadInstancesList();
  await loadMonthData();
  renderTab();
});

/* ============================= INIT ============================= */
(async function init(){
  document.getElementById('monthPicker').value = currentMonth;
  document.getElementById('monthLabel').textContent = monthLabelAr(currentMonth);
  const verEl = document.getElementById('appVersion');
  if(verEl){ verEl.textContent = 'v' + APP_VERSION; verEl.style.cursor = 'pointer'; verEl.title = 'دوس عشان تشوف سجل التحديثات'; verEl.onclick = showChangelog; }
  await loadAll();
  renderTab();
})();

function showChangelog(){
  const overlay = document.getElementById('calcOverlay');
  const rows = CHANGELOG.map(c=>`
    <div style="padding:8px 0; border-bottom:1px solid var(--line);">
      <div style="font-weight:800; color:var(--navy); font-family:'Cairo',sans-serif; font-size:13.5px;">الإصدار ${c.v}</div>
      <div style="font-size:12.5px; color:var(--muted); margin-top:2px; line-height:1.7;">${escapeHTMLp(c.notes)}</div>
    </div>
  `).join('');
  overlay.innerHTML = `
    <div class="modal-box" style="max-width:420px;">
      <h3>سجل تحديثات البرنامج (الإصدار الحالي: ${APP_VERSION})</h3>
      <div style="max-height:360px; overflow-y:auto; margin-bottom:14px;">${rows}</div>
      <div class="modal-actions"><span></span><button class="btn btn-primary" onclick="document.getElementById('calcOverlay').style.display='none';">حسنًا</button></div>
    </div>
  `;
  overlay.style.display = 'flex';
}

</script>
